# The NeuroForest app's deploy manifest — read by rodis ≥ 0.5.1 (PLAN-2026-322), typed
# as `deploy nf-app …` from anywhere (PLAN-2026-319): `--bump patch` is the release AND
# the deploy. What ships is the tree the import host runs: tasks/ (the invoke task
# root — the nightly sbase backup runs from it), assets/ (the ontology plugins), .env
# (the config base) and VERSION. Nothing installs, nothing restarts: the backup timer
# runs the tree fresh each night. The wheel the tasks import is neuro's own deploy
# (`deploy neuro`, PLAN-2026-321); the preflight below only asserts it is there.
#
# WHERE it lands is not in this file. The repo is public, and a target is an
# absolute path on a named host, so the one [[target]] (host, path, venv) lives in
# deploy.local.toml beside this one — untracked, merged by rodis at load
# (PLAN-2026-324). Without it rodis refuses: a clone that cannot deploy, by design.
# The Sirin deploy-targets seeder holds every value.

[app]
name         = "nf-app"                                 # the source component and the target, nf-app@zz-imi
version_file = "VERSION"                                # the one literal (APP_VERSION left .env with it)
tree         = ["VERSION", "tasks", "assets", ".env"]   # gate 1: exactly what ships — a tw5 or desktop
                                                        # commit demands no bump, a tasks edit cannot leave
                                                        # under a stale version
[release]
branch = "develop"                    # the working branch; master is fast-forwarded by hand
tag    = "v{version}"                 # with the GitHub push (v1.8.1 is annotated already)
twins  = []                           # VERSION is the only place the version is stated

# ── per target, before the rsync ────────────────────────────────────────────
[[preflight]]
name = "the host's neuro satisfies the submodule's VERSION"
run  = "scripts/preflight/neuro-present"

# ── what ships ──────────────────────────────────────────────────────────────
[[ship]]
src     = "tasks/"
dst     = "tasks/"
exclude = ["__pycache__/", "*.pyc", "ruff.toml"]
delete  = true
[[ship]]
src     = "assets/"
dst     = "assets/"
exclude = ["__pycache__/", "*.pyc"]
delete  = true
[[ship]]
src    = ".env"
dst    = ""
delete = false
[[ship]]
src    = "VERSION"
dst    = ""
delete = false

# ── the proof, on the host ──────────────────────────────────────────────────
[[health]]
run = "scripts/health/host-probe"
