name: Tests

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Run Ruff
        uses: astral-sh/ruff-action@v1
        with:
          args: "check"
          src: "tasks tests"

  test:
    runs-on: ubuntu-latest
    env:
      APP_DIR: ${{ github.workspace }}
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/nenv
      UV_PYTHON: "3.14"
    strategy:
      fail-fast: false
      matrix:
        component: [app, neuro, tw5]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: astral-sh/setup-uv@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: uv sync --frozen --project neuro --extra dev

      - name: Compile TW5 plugins
        if: matrix.component == 'neuro'
        run: nenv/bin/invoke tw5.compile

      - name: Run ${{ matrix.component }} tests
        run: nenv/bin/invoke test.local -c ${{ matrix.component }}
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NEO4J_PASSWORD: testpass
          ONTOLOGY: assets/ontology:assets/test/input/ontology
